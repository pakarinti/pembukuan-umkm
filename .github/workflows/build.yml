name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Create Flutter Project Structure
      run: |
        flutter create --org com.umkm --project-name pembukuan .
        
        cat << 'EOF' > pubspec.yaml
        name: pembukuan
        description: Aplikasi Bkper Fixed Category Group Order
        publish_to: 'none'
        version: 1.0.0+1

        environment:
          sdk: '>=3.0.0 <4.0.0'

        dependencies:
          flutter:
            sdk: flutter
          cupertino_icons: ^1.0.6
          sqflite: ^2.3.0
          path: ^1.8.3
          intl: ^0.19.0

        dev_dependencies:
          flutter_test:
            sdk: flutter
          flutter_lints: ^3.0.0

        flutter:
          uses-material-design: true
        EOF

        cat << 'EOF' > lib/main.dart
        import 'package:flutter/material.dart';
        import 'package:sqflite/sqflite.dart';
        import 'package:path/path.dart' as p;
        import 'package:intl/intl.dart';

        void main() async {
          WidgetsFlutterBinding.ensureInitialized();
          final dbPath = await getDatabasesPath();
          final database = await openDatabase(
            p.join(dbPath, 'bkper_group_order.db'),
            onCreate: (db, version) async {
              await db.execute('''
                CREATE TABLE books(
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  name TEXT UNIQUE
                )
              ''');
              await db.execute('''
                CREATE TABLE accounts(
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  book_id INTEGER,
                  name TEXT,
                  type TEXT
                )
              ''');
              await db.execute('''
                CREATE TABLE transactions(
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  book_id INTEGER,
                  date TEXT,
                  from_account TEXT,
                  to_account TEXT,
                  description TEXT,
                  amount REAL
                )
              ''');

              await db.insert('books', {'name': 'Bisnis Anda'});
            },
            version: 1,
          );
          runApp(BkperApp(database: database));
        }

        class BkperApp extends StatelessWidget {
          final Database database;
          const BkperApp({super.key, required this.database});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              debugShowCheckedModeBanner: false,
              title: 'Bkper UMKM',
              theme: ThemeData.dark().copyWith(
                scaffoldBackgroundColor: const Color(0xFF121318),
                primaryColor: const Color(0xFF1C1D24),
                colorScheme: const ColorScheme.dark(primary: Colors.blueAccent),
              ),
              home: HomeScreen(database: database),
            );
          }
        }

        class HomeScreen extends StatefulWidget {
          final Database database;
          const HomeScreen({super.key, required this.database});

          @override
          State<HomeScreen> createState() => _HomeScreenState();
        }

        class _HomeScreenState extends State<HomeScreen> {
          List<Map<String, dynamic>> _books = [];
          int? _currentBookId;
          String _currentBookName = '';

          List<Map<String, dynamic>> _allTransactions = [];
          List<Map<String, dynamic>> _allAccounts = [];
          String? _selectedAccountFilter;
          String _searchQuery = '';
          DateTime _selectedMonthPeriod = DateTime.now();

          @override
          void initState() {
            super.initState();
            _loadBooks();
          }

          Future<void> _loadBooks() async {
            final bData = await widget.database.query('books', orderBy: 'id ASC');
            if (bData.isNotEmpty) {
              setState(() {
                _books = bData;
                _currentBookId = bData.first['id'] as int;
                _currentBookName = bData.first['name'] as String;
              });
              _loadDataForCurrentBook();
            }
          }

          Future<void> _loadDataForCurrentBook() async {
            if (_currentBookId == null) return;
            final txData = await widget.database.query(
              'transactions',
              where: 'book_id = ?',
              whereArgs: [_currentBookId],
              orderBy: 'date DESC, id DESC',
            );
            final accData = await widget.database.query(
              'accounts',
              where: 'book_id = ?',
              whereArgs: [_currentBookId],
              orderBy: 'id ASC',
            );
            setState(() {
              _allTransactions = txData;
              _allAccounts = accData;
              _selectedAccountFilter = null;
            });
          }

          Future<void> _createBook(String name) async {
            try {
              final id = await widget.database.insert('books', {'name': name});
              final bData = await widget.database.query('books');
              setState(() {
                _books = bData;
                _currentBookId = id;
                _currentBookName = name;
              });
              _loadDataForCurrentBook();
            } catch (e) {}
          }

          Future<void> _updateBook(int id, String name) async {
            await widget.database.update('books', {'name': name}, where: 'id = ?', whereArgs: [id]);
            _loadBooks();
          }

          Future<void> _deleteBook(int id) async {
            if (_books.length <= 1) return;
            await widget.database.delete('books', where: 'id = ?', whereArgs: [id]);
            await widget.database.delete('accounts', where: 'book_id = ?', whereArgs: [id]);
            await widget.database.delete('transactions', where: 'book_id = ?', whereArgs: [id]);
            _loadBooks();
          }

          double _getAccountTotalMonthly(Map<String, dynamic> acc) {
            String accName = acc['name'];
            String accType = acc['type'];
            double total = 0;
            String monthYearTarget = DateFormat('MM/yyyy').format(_selectedMonthPeriod);

            for (var tx in _allTransactions) {
              String txDateStr = tx['date'];
              if (txDateStr.length >= 10) {
                String txMonthYear = txDateStr.substring(3);
                if (txMonthYear == monthYearTarget) {
                  if (tx['to_account'] == accName) {
                    total += (tx['amount'] as num).toDouble();
                  } else if (tx['from_account'] == accName) {
                    total += (accType == 'Incoming') ? (tx['amount'] as num).toDouble() : -(tx['amount'] as num).toDouble();
                  }
                }
              }
            }
            return total;
          }

          Future<void> _addAccount(String name, String type) async {
            await widget.database.insert('accounts', {
              'book_id': _currentBookId,
              'name': name,
              'type': type,
            });
            _loadDataForCurrentBook();
          }

          Future<void> _updateAccount(int id, String name, String type) async {
            await widget.database.update(
              'accounts',
              {'name': name, 'type': type},
              where: 'id = ?',
              whereArgs: [id],
            );
            _loadDataForCurrentBook();
          }

          Future<void> _deleteAccount(int id, String name) async {
            await widget.database.delete('accounts', where: 'id = ?', whereArgs: [id]);
            await widget.database.delete('transactions', where: 'book_id = ? AND (from_account = ? OR to_account = ?)', whereArgs: [_currentBookId, name, name]);
            _loadDataForCurrentBook();
          }

          Future<void> _addTransaction(String fromAcc, String toAcc, String desc, double amount, DateTime date) async {
            await widget.database.insert('transactions', {
              'book_id': _currentBookId,
              'date': DateFormat('dd/MM/yyyy').format(date),
              'from_account': fromAcc,
              'to_account': toAcc,
              'description': desc,
              'amount': amount,
            });
            _loadDataForCurrentBook();
          }

          Future<void> _updateTransaction(int id, String fromAcc, String toAcc, String desc, double amount, DateTime date) async {
            await widget.database.update(
              'transactions',
              {
                'date': DateFormat('dd/MM/yyyy').format(date),
                'from_account': fromAcc,
                'to_account': toAcc,
                'description': desc,
                'amount': amount,
              },
              where: 'id = ?',
              whereArgs: [id],
            );
            _loadDataForCurrentBook();
          }

          Future<void> _deleteTransaction(int id) async {
            await widget.database.delete('transactions', where: 'id = ?', whereArgs: [id]);
            _loadDataForCurrentBook();
          }

          Color _getAccountColor(String type) {
            switch (type) {
              case 'Asset': return const Color(0xFF2196F3);
              case 'Liability': return const Color(0xFFFFC107);
              case 'Incoming': return const Color(0xFF4CAF50);
              case 'Outgoing': return const Color(0xFFF44336);
              default: return Colors.grey;
            }
          }

          void _showBookDialog({Map<String, dynamic>? bookEdit}) {
            final bookCtrl = TextEditingController(text: bookEdit != null ? bookEdit['name'] : '');
            showDialog(
              context: context,
              builder: (ctx) => AlertDialog(
                backgroundColor: const Color(0xFF1E1E26),
                title: Text(bookEdit == null ? 'Create New Book' : 'Edit Book Name'),
                content: TextField(controller: bookCtrl, decoration: const InputDecoration(labelText: 'Book / Business Name')),
                actions: [
                  TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                  ElevatedButton(
                    style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent, foregroundColor: Colors.white),
                    onPressed: () {
                      if (bookCtrl.text.isNotEmpty) {
                        if (bookEdit == null) {
                          _createBook(bookCtrl.text);
                        } else {
                          _updateBook(bookEdit['id'], bookCtrl.text);
                        }
                        Navigator.pop(ctx);
                      }
                    },
                    child: Text(bookEdit == null ? 'Create' : 'Save'),
                  )
                ],
              ),
            );
          }

          void _showNewAccountDialog({Map<String, dynamic>? editAcc}) {
            final nameCtrl = TextEditingController(text: editAcc != null ? editAcc['name'] : '');
            String selectedType = editAcc != null ? editAcc['type'] : 'Outgoing';

            showDialog(
              context: context,
              builder: (ctx) => StatefulBuilder(
                builder: (context, setDlgState) => AlertDialog(
                  backgroundColor: const Color(0xFF1E1E26),
                  title: Text(editAcc == null ? 'New Account' : 'Edit Account'),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      TextField(controller: nameCtrl, decoration: const InputDecoration(labelText: 'Name')),
                      const SizedBox(height: 10),
                      DropdownButtonFormField<String>(
                        value: selectedType,
                        dropdownColor: const Color(0xFF2C2D38),
                        items: ['Asset', 'Liability', 'Incoming', 'Outgoing']
                            .map((t) => DropdownMenuItem(value: t, child: Text(t))).toList(),
                        onChanged: (v) => setDlgState(() => selectedType = v!),
                        decoration: const InputDecoration(labelText: 'Type'),
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent, foregroundColor: Colors.white),
                      onPressed: () {
                        if (nameCtrl.text.isNotEmpty) {
                          if (editAcc == null) {
                            _addAccount(nameCtrl.text, selectedType);
                          } else {
                            _updateAccount(editAcc['id'], nameCtrl.text, selectedType);
                          }
                          Navigator.pop(ctx);
                        }
                      },
                      child: Text(editAcc == null ? 'Create' : 'Save'),
                    ),
                  ],
                ),
              ),
            );
          }

          void _showFormDialog({Map<String, dynamic>? txEdit}) {
            final descCtrl = TextEditingController(text: txEdit != null ? txEdit['description'] : '');
            final amountCtrl = TextEditingController(text: txEdit != null ? txEdit['amount'].toString() : '');
            DateTime pickerDate = txEdit != null ? DateFormat('dd/MM/yyyy').parse(txEdit['date']) : DateTime.now();

            List<String> accNames = _allAccounts.map((a) => a['name'] as String).toList();
            String? fromAcc = txEdit != null ? txEdit['from_account'] : (accNames.isNotEmpty ? accNames.first : null);
            String? toAcc = txEdit != null ? txEdit['to_account'] : (accNames.length > 1 ? accNames[1] : (accNames.isNotEmpty ? accNames.first : null));

            showModalBottomSheet(
              context: context,
              isScrollControlled: true,
              backgroundColor: const Color(0xFF14151B),
              builder: (ctx) => StatefulBuilder(
                builder: (context, setModalState) {
                  return Padding(
                    padding: EdgeInsets.only(top: 16, left: 16, right: 16, bottom: MediaQuery.of(ctx).viewInsets.bottom + 16),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(txEdit == null ? 'New transaction' : 'Transaction', style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Colors.white)),
                        const SizedBox(height: 15),
                        Row(
                          children: [
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  const Text('Date:', style: TextStyle(color: Colors.grey, fontSize: 12)),
                                  const SizedBox(height: 4),
                                  InkWell(
                                    onTap: () async {
                                      final picked = await showDatePicker(
                                        context: context,
                                        initialDate: pickerDate,
                                        firstDate: DateTime(2020),
                                        lastDate: DateTime(2030),
                                      );
                                      if (picked != null) setModalState(() => pickerDate = picked);
                                    },
                                    child: Container(
                                      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 12),
                                      decoration: BoxDecoration(border: Border.all(color: Colors.white24), borderRadius: BorderRadius.circular(6)),
                                      child: Row(
                                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                        children: [
                                          Text(DateFormat('dd/MM/yyyy').format(pickerDate), style: const TextStyle(fontSize: 13)),
                                          const Icon(Icons.calendar_today, size: 16, color: Colors.grey),
                                        ],
                                      ),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                            const SizedBox(width: 10),
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  const Text('Amount:', style: TextStyle(color: Colors.grey, fontSize: 12)),
                                  const SizedBox(height: 4),
                                  TextField(
                                    controller: amountCtrl,
                                    keyboardType: TextInputType.number,
                                    decoration: InputDecoration(
                                      hintText: '0.00',
                                      contentPadding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),
                                      border: OutlineInputBorder(borderRadius: BorderRadius.circular(6)),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 12),
                        const Text('From account:', style: TextStyle(color: Colors.grey, fontSize: 12)),
                        const SizedBox(height: 4),
                        accNames.isEmpty
                            ? const Text('Belum ada akun.', style: TextStyle(color: Colors.amber, fontSize: 12))
                            : DropdownButtonFormField<String>(
                                value: accNames.contains(fromAcc) ? fromAcc : null,
                                dropdownColor: const Color(0xFF2C2D38),
                                items: accNames.map((a) => DropdownMenuItem(value: a, child: Text(a))).toList(),
                                onChanged: (v) => setModalState(() => fromAcc = v),
                                decoration: InputDecoration(
                                  contentPadding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),
                                  border: OutlineInputBorder(borderRadius: BorderRadius.circular(6)),
                                ),
                              ),
                        const SizedBox(height: 12),
                        const Text('To account:', style: TextStyle(color: Colors.grey, fontSize: 12)),
                        const SizedBox(height: 4),
                        accNames.isEmpty
                            ? const SizedBox()
                            : DropdownButtonFormField<String>(
                                value: accNames.contains(toAcc) ? toAcc : null,
                                dropdownColor: const Color(0xFF2C2D38),
                                items: accNames.map((a) => DropdownMenuItem(value: a, child: Text(a))).toList(),
                                onChanged: (v) => setModalState(() => toAcc = v),
                                decoration: InputDecoration(
                                  contentPadding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),
                                  border: OutlineInputBorder(borderRadius: BorderRadius.circular(6)),
                                ),
                              ),
                        const SizedBox(height: 12),
                        const Text('Description:', style: TextStyle(color: Colors.grey, fontSize: 12)),
                        const SizedBox(height: 4),
                        TextField(
                          controller: descCtrl,
                          decoration: InputDecoration(
                            contentPadding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),
                            border: OutlineInputBorder(borderRadius: BorderRadius.circular(6)),
                          ),
                        ),
                        const SizedBox(height: 20),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            txEdit != null
                                ? IconButton(
                                    icon: const Icon(Icons.delete_outline, color: Colors.grey),
                                    onPressed: () {
                                      _deleteTransaction(txEdit['id']);
                                      Navigator.pop(ctx);
                                    },
                                  )
                                : const SizedBox(),
                            Row(
                              children: [
                                OutlinedButton(
                                  onPressed: () => Navigator.pop(ctx),
                                  style: OutlinedButton.styleFrom(foregroundColor: Colors.grey),
                                  child: const Text('Close'),
                                ),
                                const SizedBox(width: 8),
                                ElevatedButton(
                                  style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent, foregroundColor: Colors.white),
                                  onPressed: () {
                                    final amt = double.tryParse(amountCtrl.text) ?? 0;
                                    if (amt > 0 && fromAcc != null && toAcc != null) {
                                      if (txEdit == null) {
                                        _addTransaction(fromAcc!, toAcc!, descCtrl.text, amt, pickerDate);
                                      } else {
                                        _updateTransaction(txEdit['id'], fromAcc!, toAcc!, descCtrl.text, amt, pickerDate);
                                      }
                                      Navigator.pop(ctx);
                                    }
                                  },
                                  child: Text(txEdit == null ? 'Post' : 'Save'),
                                ),
                              ],
                            ),
                          ],
                        )
                      ],
                    ),
                  );
                },
              ),
            );
          }

          @override
          Widget build(BuildContext context) {
            List<Map<String, dynamic>> filteredList = _allTransactions.where((tx) {
              bool matchFilter = _selectedAccountFilter == null || tx['from_account'] == _selectedAccountFilter || tx['to_account'] == _selectedAccountFilter;
              bool matchSearch = _searchQuery.isEmpty ||
                  tx['description'].toString().toLowerCase().contains(_searchQuery.toLowerCase()) ||
                  tx['from_account'].toString().toLowerCase().contains(_searchQuery.toLowerCase()) ||
                  tx['to_account'].toString().toLowerCase().contains(_searchQuery.toLowerCase()) ||
                  tx['amount'].toString().contains(_searchQuery);
              return matchFilter && matchSearch;
            }).toList();

            // PENGELOMPOKAN URUTAN PERSIS BKPER:
            // Balance Sheet: ASSET dulu baru LIABILITY
            final assetAccs = _allAccounts.where((a) => a['type'] == 'Asset').toList();
            final liabilityAccs = _allAccounts.where((a) => a['type'] == 'Liability').toList();
            final balanceSheetAccs = [...assetAccs, ...liabilityAccs];

            // Incoming & Outgoing: INCOMING dulu baru OUTGOING
            final incomingAccs = _allAccounts.where((a) => a['type'] == 'Incoming').toList();
            final outgoingAccs = _allAccounts.where((a) => a['type'] == 'Outgoing').toList();
            final incomingOutgoingAccs = [...incomingAccs, ...outgoingAccs];

            return Scaffold(
              appBar: AppBar(
                backgroundColor: const Color(0xFF1C1D24),
                title: PopupMenuButton<dynamic>(
                  child: Row(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Text(_currentBookName.isEmpty ? 'Pilih Buku' : _currentBookName, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                      const Icon(Icons.arrow_drop_down),
                    ],
                  ),
                  onSelected: (val) {
                    if (val == 'CREATE_NEW') {
                      _showBookDialog();
                    } else if (val is Map && val.containsKey('id')) {
                      setState(() {
                        _currentBookId = val['id'];
                        _currentBookName = val['name'];
                      });
                      _loadDataForCurrentBook();
                    }
                  },
                  itemBuilder: (ctx) => [
                    ..._books.map((b) => PopupMenuItem(
                          value: b,
                          child: Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              Text(b['name'], style: TextStyle(fontWeight: b['id'] == _currentBookId ? FontWeight.bold : FontWeight.normal)),
                              Row(
                                children: [
                                  IconButton(
                                    icon: const Icon(Icons.edit, size: 16, color: Colors.grey),
                                    onPressed: () {
                                      Navigator.pop(ctx);
                                      _showBookDialog(bookEdit: b);
                                    },
                                  ),
                                  if (_books.length > 1)
                                    IconButton(
                                      icon: const Icon(Icons.delete, size: 16, color: Colors.redAccent),
                                      onPressed: () {
                                        Navigator.pop(ctx);
                                        _deleteBook(b['id']);
                                      },
                                    ),
                                ],
                              )
                            ],
                          ),
                        )),
                    const PopupMenuDivider(),
                    const PopupMenuItem(
                      value: 'CREATE_NEW',
                      child: Row(
                        children: [
                          Icon(Icons.add, color: Colors.blueAccent, size: 20),
                          SizedBox(width: 8),
                          Text('Create New Book', style: TextStyle(color: Colors.blueAccent, fontWeight: FontWeight.bold)),
                        ],
                      ),
                    ),
                  ],
                ),
                actions: [
                  if (_selectedAccountFilter != null)
                    IconButton(
                      icon: const Icon(Icons.clear),
                      onPressed: () => setState(() => _selectedAccountFilter = null),
                    )
                ],
              ),
              drawer: Drawer(
                backgroundColor: const Color(0xFF14151B),
                child: StatefulBuilder(
                  builder: (context, setDrawerState) => DefaultTabController(
                    length: 2,
                    child: Scaffold(
                      backgroundColor: Colors.transparent,
                      appBar: AppBar(
                        automaticallyImplyLeading: false,
                        backgroundColor: const Color(0xFF1C1D24),
                        title: const TabBar(
                          indicatorColor: Colors.blueAccent,
                          tabs: [
                            Tab(text: 'Transactions'),
                            Tab(text: 'Accounts'),
                          ],
                        ),
                      ),
                      body: TabBarView(
                        children: [
                          ListView(
                            padding: const EdgeInsets.all(12),
                            children: [
                              Row(
                                mainAxisAlignment: MainAxisAlignment.center,
                                children: [
                                  IconButton(
                                    icon: const Icon(Icons.chevron_left, color: Colors.grey),
                                    onPressed: () {
                                      setDrawerState(() {
                                        _selectedMonthPeriod = DateTime(_selectedMonthPeriod.year, _selectedMonthPeriod.month - 1);
                                      });
                                      setState(() {});
                                    },
                                  ),
                                  Text(
                                    DateFormat('MM/yyyy').format(_selectedMonthPeriod),
                                    style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 14, color: Colors.blueAccent),
                                  ),
                                  IconButton(
                                    icon: const Icon(Icons.chevron_right, color: Colors.grey),
                                    onPressed: () {
                                      setDrawerState(() {
                                        _selectedMonthPeriod = DateTime(_selectedMonthPeriod.year, _selectedMonthPeriod.month + 1);
                                      });
                                      setState(() {});
                                    },
                                  ),
                                ],
                              ),
                              ListTile(
                                dense: true,
                                contentPadding: EdgeInsets.zero,
                                leading: const Icon(Icons.list, color: Colors.blueAccent),
                                title: const Text('Semua Transaksi', style: TextStyle(color: Colors.blueAccent, fontWeight: FontWeight.bold)),
                                onTap: () {
                                  setState(() => _selectedAccountFilter = null);
                                  Navigator.pop(context);
                                },
                              ),
                              const SizedBox(height: 10),
                              const Text('Balance Sheet', style: TextStyle(color: Colors.grey, fontWeight: FontWeight.bold, fontSize: 13)),
                              const Divider(color: Colors.white12),
                              ...balanceSheetAccs.map((acc) => _buildTransactionDrawerItem(acc)),
                              const SizedBox(height: 20),
                              const Text('Incoming & Outgoing', style: TextStyle(color: Colors.grey, fontWeight: FontWeight.bold, fontSize: 13)),
                              const Divider(color: Colors.white12),
                              ...incomingOutgoingAccs.map((acc) => _buildTransactionDrawerItem(acc)),
                            ],
                          ),
                          Column(
                            children: [
                              ListTile(
                                leading: const Icon(Icons.add, color: Colors.blueAccent),
                                title: const Text('New account', style: TextStyle(color: Colors.blueAccent, fontWeight: FontWeight.bold)),
                                onTap: () {
                                  Navigator.pop(context);
                                  _showNewAccountDialog();
                                },
                              ),
                              const Divider(color: Colors.white12),
                              Expanded(
                                child: _allAccounts.isEmpty
                                    ? const Center(child: Text('Belum ada akun.', style: TextStyle(color: Colors.grey, fontSize: 11)))
                                    : ListView.builder(
                                        itemCount: _allAccounts.length,
                                        itemBuilder: (ctx, i) {
                                          final acc = _allAccounts[i];
                                          return ListTile(
                                            leading: Container(
                                              width: 14,
                                              height: 14,
                                              decoration: BoxDecoration(
                                                color: _getAccountColor(acc['type']),
                                                borderRadius: BorderRadius.circular(3),
                                              ),
                                            ),
                                            title: Text(acc['name'], style: const TextStyle(color: Colors.white, fontSize: 14)),
                                            trailing: Row(
                                              mainAxisSize: MainAxisSize.min,
                                              children: [
                                                IconButton(
                                                  icon: const Icon(Icons.edit, size: 18, color: Colors.grey),
                                                  onPressed: () {
                                                    Navigator.pop(context);
                                                    _showNewAccountDialog(editAcc: acc);
                                                  },
                                                ),
                                                IconButton(
                                                  icon: const Icon(Icons.delete, size: 18, color: Colors.redAccent),
                                                  onPressed: () {
                                                    _deleteAccount(acc['id'], acc['name']);
                                                    Navigator.pop(context);
                                                  },
                                                ),
                                              ],
                                            ),
                                          );
                                        },
                                      ),
                              ),
                            ],
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              ),
              body: Column(
                children: [
                  Padding(
                    padding: const EdgeInsets.all(10.0),
                    child: TextField(
                      onChanged: (val) => setState(() => _searchQuery = val),
                      decoration: InputDecoration(
                        hintText: 'Search transactions...',
                        prefixIcon: const Icon(Icons.search, color: Colors.grey),
                        contentPadding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),
                        filled: true,
                        fillColor: const Color(0xFF1C1D24),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(8), borderSide: BorderSide.none),
                      ),
                    ),
                  ),
                  Expanded(
                    child: filteredList.isEmpty
                        ? const Center(child: Text('Tidak ada transaksi', style: TextStyle(color: Colors.grey)))
                        : ListView.builder(
                            itemCount: filteredList.length,
                            itemBuilder: (ctx, i) {
                              final tx = filteredList[i];
                              return Container(
                                decoration: const BoxDecoration(border: Border(bottom: BorderSide(color: Colors.white12))),
                                child: ListTile(
                                  onTap: () => _showFormDialog(txEdit: tx),
                                  leading: const Icon(Icons.check_circle_outline, color: Colors.green),
                                  title: Text(tx['description'].isEmpty ? '${tx['from_account']} → ${tx['to_account']}' : tx['description']),
                                  subtitle: Text('${tx['date']} • ${tx['from_account']} → ${tx['to_account']}'),
                                  trailing: Text(
                                    'Rp ${tx['amount'].toStringAsFixed(0)}',
                                    style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.blueAccent),
                                  ),
                                ),
                              );
                            },
                          ),
                  ),
                ],
              ),
              floatingActionButton: FloatingActionButton(
                backgroundColor: Colors.blueAccent,
                onPressed: () => _showFormDialog(),
                child: const Icon(Icons.add, color: Colors.white),
              ),
            );
          }

          Widget _buildTransactionDrawerItem(Map<String, dynamic> acc) {
            double total = _getAccountTotalMonthly(acc);
            Color accColor = _getAccountColor(acc['type']);

            return Container(
              margin: const EdgeInsets.symmetric(vertical: 2),
              decoration: BoxDecoration(
                border: Border(left: BorderSide(color: accColor, width: 4)),
              ),
              child: ListTile(
                dense: true,
                contentPadding: const EdgeInsets.only(left: 8),
                title: Text(acc['name'], style: const TextStyle(color: Colors.white, fontSize: 13)),
                trailing: Text(
                  'Rp ${total.toStringAsFixed(0)}',
                  style: TextStyle(color: accColor, fontWeight: FontWeight.bold, fontSize: 13),
                ),
                onTap: () {
                  setState(() => _selectedAccountFilter = acc['name']);
                  Navigator.pop(context);
                },
              ),
            );
          }
        }
        EOF

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pembukuan-umkm-apk
        path: build/app/outputs/flutter-apk/app-release.apk
