name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Create Flutter Project Structure
      run: |
        flutter create --org com.umkm --project-name pembukuan .
        
        cat << 'EOF' > pubspec.yaml
        name: pembukuan
        description: Aplikasi Bkper Exact Replica
        publish_to: 'none'
        version: 1.0.0+1

        environment:
          sdk: '>=3.0.0 <4.0.0'

        dependencies:
          flutter:
            sdk: flutter
          cupertino_icons: ^1.0.6
          sqflite: ^2.3.0
          path: ^1.8.3
          intl: ^0.19.0

        dev_dependencies:
          flutter_test:
            sdk: flutter
          flutter_lints: ^3.0.0

        flutter:
          uses-material-design: true
        EOF

        cat << 'EOF' > lib/main.dart
        import 'package:flutter/material.dart';
        import 'package:sqflite/sqflite.dart';
        import 'package:path/path.dart' as p;
        import 'package:intl/intl.dart';

        void main() async {
          WidgetsFlutterBinding.ensureInitialized();
          final dbPath = await getDatabasesPath();
          final database = await openDatabase(
            p.join(dbPath, 'bkper_exact.db'),
            onCreate: (db, version) async {
              await db.execute('''
                CREATE TABLE accounts(
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  name TEXT UNIQUE,
                  type TEXT
                )
              ''');
              await db.execute('''
                CREATE TABLE transactions(
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  date TEXT,
                  account TEXT,
                  description TEXT,
                  amount REAL,
                  type TEXT
                )
              ''');

              // Akun Bawaan Awal ala Bkper
              await db.insert('accounts', {'name': 'Cadangan Biaya Perawatan', 'type': 'Asset'});
              await db.insert('accounts', {'name': 'Inventaris / Aset Tetap', 'type': 'Asset'});
              await db.insert('accounts', {'name': 'Kas', 'type': 'Asset'});
              await db.insert('accounts', {'name': 'Rekening Bank', 'type': 'Asset'});
              await db.insert('accounts', {'name': 'Simpanan THR Karyawan', 'type': 'Asset'});
              await db.insert('accounts', {'name': 'Tabungan Ekspansi', 'type': 'Asset'});
              await db.insert('accounts', {'name': 'Deviden Adia Pakarinti', 'type': 'Asset'});
              await db.insert('accounts', {'name': 'Deviden Massinangling Gumelar', 'type': 'Asset'});
              await db.insert('accounts', {'name': 'Deviden Supra Carthica', 'type': 'Liability'});
              await db.insert('accounts', {'name': 'Prive Rumah Tangga', 'type': 'Liability'});
              await db.insert('accounts', {'name': 'Utang Bank', 'type': 'Liability'});
              await db.insert('accounts', {'name': 'Utang PPh Final UMKM', 'type': 'Liability'});
              
              await db.insert('accounts', {'name': 'Penjualan Kamar', 'type': 'Incoming'});
              await db.insert('accounts', {'name': 'Beban Bunga Bank', 'type': 'Outgoing'});
              await db.insert('accounts', {'name': 'Beban Pajak', 'type': 'Outgoing'});
              await db.insert('accounts', {'name': 'Biaya Perawatan', 'type': 'Outgoing'});
              await db.insert('accounts', {'name': 'Gaji Karyawan', 'type': 'Outgoing'});
              await db.insert('accounts', {'name': 'Operasional', 'type': 'Outgoing'});
              await db.insert('accounts', {'name': 'Pengeluaran THR Karyawan', 'type': 'Outgoing'});
            },
            version: 1,
          );
          runApp(BkperApp(database: database));
        }

        class BkperApp extends StatelessWidget {
          final Database database;
          const BkperApp({super.key, required this.database});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              debugShowCheckedModeBanner: false,
              title: 'Bkper UMKM',
              theme: ThemeData.dark().copyWith(
                scaffoldBackgroundColor: const Color(0xFF121318),
                primaryColor: const Color(0xFF1C1D24),
                colorScheme: const ColorScheme.dark(primary: Colors.blueAccent),
              ),
              home: HomeScreen(database: database),
            );
          }
        }

        class HomeScreen extends StatefulWidget {
          final Database database;
          const HomeScreen({super.key, required this.database});

          @override
          State<HomeScreen> createState() => _HomeScreenState();
        }

        class _HomeScreenState extends State<HomeScreen> {
          List<Map<String, dynamic>> _allTransactions = [];
          List<Map<String, dynamic>> _allAccounts = [];
          String? _selectedAccountFilter;

          @override
          void initState() {
            super.initState();
            _loadData();
          }

          Future<void> _loadData() async {
            final txData = await widget.database.query('transactions', orderBy: 'date DESC, id DESC');
            final accData = await widget.database.query('accounts', orderBy: 'id ASC');
            setState(() {
              _allTransactions = txData;
              _allAccounts = accData;
            });
          }

          double _getAccountTotal(String accName) {
            double total = 0;
            for (var tx in _allTransactions) {
              if (tx['account'] == accName) {
                total += (tx['amount'] as num).toDouble();
              }
            }
            return total;
          }

          Future<void> _addAccount(String name, String type) async {
            try {
              await widget.database.insert('accounts', {'name': name, 'type': type});
              _loadData();
            } catch (e) {}
          }

          Future<void> _addTransaction(String account, String desc, double amount, String type, DateTime date) async {
            await widget.database.insert('transactions', {
              'date': DateFormat('dd/MM/yyyy').format(date),
              'account': account,
              'description': desc,
              'amount': amount,
              'type': type,
            });
            _loadData();
          }

          Color _getAccountColor(String type) {
            switch (type) {
              case 'Asset': return Colors.blue;
              case 'Liability': return Colors.amber;
              case 'Incoming': return Colors.green;
              case 'Outgoing': return Colors.redAccent;
              default: return Colors.grey;
            }
          }

          void _showNewAccountDialog() {
            final nameCtrl = TextEditingController();
            String selectedType = 'Outgoing';

            showDialog(
              context: context,
              builder: (ctx) => StatefulBuilder(
                builder: (context, setDlgState) => AlertDialog(
                  backgroundColor: const Color(0xFF1E1E26),
                  title: const Text('New Account'),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      TextField(controller: nameCtrl, decoration: const InputDecoration(labelText: 'Name')),
                      const SizedBox(height: 10),
                      DropdownButtonFormField<String>(
                        value: selectedType,
                        dropdownColor: const Color(0xFF2C2D38),
                        items: ['Asset', 'Liability', 'Incoming', 'Outgoing']
                            .map((t) => DropdownMenuItem(value: t, child: Text(t))).toList(),
                        onChanged: (v) => setDlgState(() => selectedType = v!),
                        decoration: const InputDecoration(labelText: 'Type'),
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent),
                      onPressed: () {
                        if (nameCtrl.text.isNotEmpty) {
                          _addAccount(nameCtrl.text, selectedType);
                          Navigator.pop(ctx);
                        }
                      },
                      child: const Text('Save'),
                    ),
                  ],
                ),
              ),
            );
          }

          void _showFormDialog() {
            final descCtrl = TextEditingController();
            final amountCtrl = TextEditingController();
            String type = 'OUT';
            DateTime pickerDate = DateTime.now();

            List<String> getAvailableAccounts(String currentType) {
              if (currentType == 'IN') {
                return _allAccounts
                    .where((a) => a['type'] == 'Incoming' || a['type'] == 'Asset')
                    .map((a) => a['name'] as String).toList();
              } else {
                return _allAccounts
                    .where((a) => a['type'] == 'Outgoing' || a['type'] == 'Asset' || a['type'] == 'Liability')
                    .map((a) => a['name'] as String).toList();
              }
            }

            List<String> activeAccList = getAvailableAccounts(type);
            String selectedAcc = activeAccList.isNotEmpty ? activeAccList.first : '';

            showModalBottomSheet(
              context: context,
              isScrollControlled: true,
              backgroundColor: const Color(0xFF1E1E26),
              builder: (ctx) => StatefulBuilder(
                builder: (context, setModalState) {
                  return Padding(
                    padding: EdgeInsets.only(top: 16, left: 16, right: 16, bottom: MediaQuery.of(ctx).viewInsets.bottom + 16),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Text('Tambah Transaksi', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white)),
                        const SizedBox(height: 10),
                        ListTile(
                          tileColor: Colors.black26,
                          title: Text("Tanggal: ${DateFormat('dd/MM/yyyy').format(pickerDate)}"),
                          trailing: const Icon(Icons.calendar_today, color: Colors.blueAccent),
                          onTap: () async {
                            final picked = await showDatePicker(
                              context: context,
                              initialDate: pickerDate,
                              firstDate: DateTime(2020),
                              lastDate: DateTime(2030),
                            );
                            if (picked != null) {
                              setModalState(() => pickerDate = picked);
                            }
                          },
                        ),
                        const SizedBox(height: 10),
                        Row(
                          children: [
                            Expanded(
                              child: RadioListTile<String>(
                                title: const Text('Masuk (+)'),
                                value: 'IN',
                                groupValue: type,
                                onChanged: (v) {
                                  setModalState(() {
                                    type = v!;
                                    activeAccList = getAvailableAccounts(type);
                                    if (activeAccList.isNotEmpty) selectedAcc = activeAccList.first;
                                  });
                                },
                              ),
                            ),
                            Expanded(
                              child: RadioListTile<String>(
                                title: const Text('Keluar (-)'),
                                value: 'OUT',
                                groupValue: type,
                                onChanged: (v) {
                                  setModalState(() {
                                    type = v!;
                                    activeAccList = getAvailableAccounts(type);
                                    if (activeAccList.isNotEmpty) selectedAcc = activeAccList.first;
                                  });
                                },
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 5),
                        DropdownButtonFormField<String>(
                          value: activeAccList.contains(selectedAcc) ? selectedAcc : null,
                          dropdownColor: const Color(0xFF2C2D38),
                          items: activeAccList.map((a) => DropdownMenuItem(value: a, child: Text(a))).toList(),
                          onChanged: (v) => setModalState(() => selectedAcc = v!),
                          decoration: const InputDecoration(labelText: 'Pilih Akun'),
                        ),
                        TextField(controller: amountCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Nominal (Rp)')),
                        TextField(controller: descCtrl, decoration: const InputDecoration(labelText: 'Keterangan')),
                        const SizedBox(height: 15),
                        ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent, foregroundColor: Colors.white, minimumSize: const Size.fromHeight(45)),
                          onPressed: () {
                            final amt = double.tryParse(amountCtrl.text) ?? 0;
                            if (amt > 0 && selectedAcc.isNotEmpty) {
                              _addTransaction(selectedAcc, descCtrl.text, amt, type, pickerDate);
                              Navigator.pop(ctx);
                            }
                          },
                          child: const Text('Simpan Transaksi'),
                        )
                      ],
                    ),
                  );
                },
              ),
            );
          }

          @override
          Widget build(BuildContext context) {
            List<Map<String, dynamic>> filteredList = _selectedAccountFilter == null
                ? _allTransactions
                : _allTransactions.where((tx) => tx['account'] == _selectedAccountFilter).toList();

            final balanceSheetAccs = _allAccounts.where((a) => a['type'] == 'Asset' || a['type'] == 'Liability').toList();
            final incomingOutgoingAccs = _allAccounts.where((a) => a['type'] == 'Incoming' || a['type'] == 'Outgoing').toList();

            return Scaffold(
              appBar: AppBar(
                title: Text(_selectedAccountFilter ?? 'All Transactions'),
                backgroundColor: const Color(0xFF1C1D24),
                actions: [
                  if (_selectedAccountFilter != null)
                    IconButton(
                      icon: const Icon(Icons.clear),
                      onPressed: () => setState(() => _selectedAccountFilter = null),
                    )
                ],
              ),
              drawer: Drawer(
                backgroundColor: const Color(0xFF14151B),
                child: DefaultTabController(
                  length: 2,
                  child: Scaffold(
                    backgroundColor: Colors.transparent,
                    appBar: AppBar(
                      automaticallyImplyLeading: false,
                      backgroundColor: const Color(0xFF1C1D24),
                      title: const TabBar(
                        indicatorColor: Colors.blueAccent,
                        tabs: [
                          Tab(text: 'Transactions'),
                          Tab(text: 'Accounts'),
                        ],
                      ),
                    ),
                    body: TabBarView(
                      children: [
                        // TAB 1: TRANSACTIONS (LIST AKUN + SALDO BALANCE SHEET & INCOMING/OUTGOING)
                        ListView(
                          padding: const EdgeInsets.all(12),
                          children: [
                            ListTile(
                              dense: true,
                              contentPadding: EdgeInsets.zero,
                              leading: const Icon(Icons.list, color: Colors.blueAccent),
                              title: const Text('Semua Transaksi', style: TextStyle(color: Colors.blueAccent, fontWeight: FontWeight.bold)),
                              onTap: () {
                                setState(() => _selectedAccountFilter = null);
                                Navigator.pop(context);
                              },
                            ),
                            const SizedBox(height: 10),
                            const Text('Balance Sheet', style: TextStyle(color: Colors.grey, fontWeight: FontWeight.bold, fontSize: 13)),
                            const Divider(color: Colors.white12),
                            ...balanceSheetAccs.map((acc) => _buildTransactionDrawerItem(acc)),
                            const SizedBox(height: 20),
                            const Text('Incoming & Outgoing', style: TextStyle(color: Colors.grey, fontWeight: FontWeight.bold, fontSize: 13)),
                            const Divider(color: Colors.white12),
                            ...incomingOutgoingAccs.map((acc) => _buildTransactionDrawerItem(acc)),
                          ],
                        ),
                        // TAB 2: ACCOUNTS (DAFTAR MURNI AKUN DENGAN IKON WARNA + NEW ACCOUNT)
                        Column(
                          children: [
                            ListTile(
                              leading: const Icon(Icons.add, color: Colors.blueAccent),
                              title: const Text('New account', style: TextStyle(color: Colors.blueAccent, fontWeight: FontWeight.bold)),
                              onTap: () {
                                Navigator.pop(context);
                                _showNewAccountDialog();
                              },
                            ),
                            const Divider(color: Colors.white12),
                            Expanded(
                              child: ListView.builder(
                                itemCount: _allAccounts.length,
                                itemBuilder: (ctx, i) {
                                  final acc = _allAccounts[i];
                                  return ListTile(
                                    leading: Container(
                                      width: 14,
                                      height: 14,
                                      decoration: BoxDecoration(
                                        color: _getAccountColor(acc['type']),
                                        borderRadius: BorderRadius.circular(3),
                                      ),
                                    ),
                                    title: Text(acc['name'], style: const TextStyle(color: Colors.white, fontSize: 14)),
                                  );
                                },
                              ),
                            ),
                          ],
                        ),
                      ],
                    ),
                  ),
                ),
              ),
              body: filteredList.isEmpty
                  ? const Center(child: Text('Tidak ada transaksi', style: TextStyle(color: Colors.grey)))
                  : ListView.builder(
                      itemCount: filteredList.length,
                      itemBuilder: (ctx, i) {
                        final tx = filteredList[i];
                        bool isInc = tx['type'] == 'IN';
                        return Container(
                          decoration: const BoxDecoration(border: Border(bottom: BorderSide(color: Colors.white12))),
                          child: ListTile(
                            leading: Icon(isInc ? Icons.check_circle_outline : Icons.remove_circle_outline, color: isInc ? Colors.green : Colors.red),
                            title: Text(tx['description'].isEmpty ? tx['account'] : tx['description']),
                            subtitle: Text('${tx['date']} • ${tx['account']}'),
                            trailing: Text(
                              'Rp ${tx['amount'].toStringAsFixed(0)}',
                              style: TextStyle(fontWeight: FontWeight.bold, color: isInc ? Colors.green : Colors.red),
                            ),
                          ),
                        );
                      },
                    ),
              floatingActionButton: FloatingActionButton(
                backgroundColor: Colors.blueAccent,
                onPressed: _showFormDialog,
                child: const Icon(Icons.add, color: Colors.white),
              ),
            );
          }

          Widget _buildTransactionDrawerItem(Map<String, dynamic> acc) {
            double total = _getAccountTotal(acc['name']);
            return ListTile(
              dense: true,
              contentPadding: EdgeInsets.zero,
              title: Text(acc['name'], style: const TextStyle(color: Colors.white, fontSize: 13)),
              trailing: Text(
                'Rp ${total.toStringAsFixed(0)}',
                style: const TextStyle(color: Colors.blueAccent, fontWeight: FontWeight.bold, fontSize: 13),
              ),
              onTap: () {
                setState(() => _selectedAccountFilter = acc['name']);
                Navigator.pop(context);
              },
            );
          }
        }
        EOF

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pembukuan-umkm-apk
        path: build/app/outputs/flutter-apk/app-release.apk
