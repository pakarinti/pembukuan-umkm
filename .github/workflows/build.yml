    - name: Generate Release Keystore & Configure Signing
      run: |
        mkdir -p android/app
        keytool -genkeypair -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -dname "CN=Kasimpel, OU=App, O=Kasimpel, L=Jakarta, ST=Jakarta, C=ID" -storepass kasimpel123 -keypass kasimpel123
        
        cat << 'EOF' > android/key.properties
        storePassword=kasimpel123
        keyPassword=kasimpel123
        keyAlias=upload
        storeFile=upload-keystore.jks
        EOF

        python3 -c "
        path = 'android/app/build.gradle'
        with open(path, 'r') as f:
            content = f.read()

        signing_code = '''
        def keystoreProperties = new Properties()
        def keystorePropertiesFile = rootProject.file('key.properties')
        if (keystorePropertiesFile.exists()) {
            keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
        }

        android {
            signingConfigs {
                release {
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                    storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                    storePassword keystoreProperties['storePassword']
                }
            }
            buildTypes {
                release {
                    signingConfig signingConfigs.release
                }
            }
        }
        '''
        
        if 'signingConfigs {' not in content:
            content += '\n' + signing_code
            with open(path, 'w') as f:
                f.write(content)
        " || true

    - name: Build APK & App Bundle (AAB)
      run: |
        flutter build apk --release
        flutter build appbundle --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kasimpel-pembukuan-umkm-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Upload AAB Artifact (Play Store Release)
      uses: actions/upload-artifact@v4
      with:
        name: kasimpel-pembukuan-umkm-aab
        path: build/app/outputs/bundle/release/app-release.aab
