                                Row(
                                  children: [
                                    IconButton(
                                      icon: const Icon(Icons.edit, size: 16, color: Colors.grey),
                                      onPressed: () {
                                        Navigator.pop(ctx);
                                        _showBookDialog(bookEdit: b);
                                      },
