name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Create Flutter Project Structure
      run: |
        flutter create --org com.umkm --project-name pembukuan .
        
        cat << 'EOF' > pubspec.yaml
        name: pembukuan
        description: Aplikasi Akuntansi UMKM Sederhana
        publish_to: 'none'
        version: 1.0.0+1

        environment:
          sdk: '>=3.0.0 <4.0.0'

        dependencies:
          flutter:
            sdk: flutter
          cupertino_icons: ^1.0.6
          sqflite: ^2.3.0
          path: ^1.8.3

        dev_dependencies:
          flutter_test:
            sdk: flutter
          flutter_lints: ^3.0.0

        flutter:
          uses-material-design: true
        EOF

        cat << 'EOF' > lib/main.dart
        import 'package:flutter/material.dart';
        import 'package:sqflite/sqflite.dart';
        import 'package:path/path.dart' as p;

        void main() async {
          WidgetsFlutterBinding.ensureInitialized();
          final dbPath = await getDatabasesPath();
          final database = await openDatabase(
            p.join(dbPath, 'umkm_full_acc.db'),
            onCreate: (db, version) async {
              await db.execute('''
                CREATE TABLE journal(
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  date TEXT,
                  description TEXT,
                  account_debit TEXT,
                  account_credit TEXT,
                  amount REAL
                )
              ''');
            },
            version: 1,
          );
          runApp(UMKMApp(database: database));
        }

        class UMKMApp extends StatelessWidget {
          final Database database;
          const UMKMApp({super.key, required this.database});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              debugShowCheckedModeBanner: false,
              title: 'Akuntansi UMKM Pro',
              theme: ThemeData(primarySwatch: Colors.green, useMaterial3: true),
              home: MainHomeScreen(database: database),
            );
          }
        }

        class MainHomeScreen extends StatefulWidget {
          final Database database;
          const MainHomeScreen({super.key, required this.database});

          @override
          State<MainHomeScreen> createState() => _MainHomeScreenState();
        }

        class _MainHomeScreenState extends State<MainHomeScreen> {
          List<Map<String, dynamic>> _journals = [];
          String _activeView = 'Jurnal Umum';

          @override
          void initState() {
            super.initState();
            _loadData();
          }

          Future<void> _loadData() async {
            final data = await widget.database.query('journal', orderBy: 'id DESC');
            setState(() {
              _journals = data;
            });
          }

          Future<void> _addTransaction(String type, String category, double amount, String desc) async {
            String debit = '1111 - KAS';
            String credit = '4111 - PENDAPATAN';

            if (type == 'OUT') {
              credit = '1111 - KAS';
              if (category.contains('Bensin') || category.contains('Operasional')) {
                debit = '5112 - BIAYA OPERASIONAL';
              } else if (category.contains('Gaji')) {
                debit = '5111 - BIAYA GAJI';
              } else if (category.contains('Prive')) {
                debit = '3112 - PRIVE PEMILIK';
              } else {
                debit = '5113 - PENGELUARAN LAIN';
              }
            } else {
              if (category.contains('Modal')) {
                credit = '3111 - MODAL USAHA';
              }
            }

            await widget.database.insert('journal', {
              'date': DateTime.now().toString().split(' ')[0],
              'description': desc.isEmpty ? category : desc,
              'account_debit': debit,
              'account_credit': credit,
              'amount': amount,
            });
            _loadData();
          }

          void _showForm(String type) {
            final amountCtrl = TextEditingController();
            final descCtrl = TextEditingController();
            List<String> categories = type == 'IN'
                ? ['Omset / Penjualan', 'Modal Tambahan']
                : ['Operasional / Bensin', 'Gaji Karyawan', 'Prive Pemilik', 'Pengeluaran Lain'];
            String selectedCat = categories.first;

            showModalBottomSheet(
              context: context,
              isScrollControlled: true,
              builder: (ctx) => Padding(
                padding: EdgeInsets.only(top: 16, left: 16, right: 16, bottom: MediaQuery.of(ctx).viewInsets.bottom + 16),
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Text(type == 'IN' ? 'Catat Uang Masuk' : 'Catat Uang Keluar', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: type == 'IN' ? Colors.green : Colors.red)),
                    const SizedBox(height: 10),
                    DropdownButtonFormField<String>(
                      value: selectedCat,
                      items: categories.map((c) => DropdownMenuItem(value: c, child: Text(c))).toList(),
                      onChanged: (v) => selectedCat = v!,
                      decoration: const InputDecoration(labelText: 'Kategori'),
                    ),
                    TextField(controller: amountCtrl, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Nominal (Rp)')),
                    TextField(controller: descCtrl, decoration: const InputDecoration(labelText: 'Keterangan')),
                    const SizedBox(height: 15),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: type == 'IN' ? Colors.green : Colors.red, foregroundColor: Colors.white, minimumSize: const Size.fromHeight(45)),
                      onPressed: () {
                        final amt = double.tryParse(amountCtrl.text) ?? 0;
                        if (amt > 0) {
                          _addTransaction(type, selectedCat, amt, descCtrl.text);
                          Navigator.pop(ctx);
                        }
                      },
                      child: const Text('Simpan'),
                    )
                  ],
                ),
              ),
            );
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              appBar: AppBar(
                title: Text(_activeView),
                backgroundColor: Colors.green.shade700,
                foregroundColor: Colors.white,
              ),
              // DRAWER / MENU STRIP 3
              drawer: Drawer(
                child: ListView(
                  padding: EdgeInsets.zero,
                  children: [
                    UserAccountsDrawerHeader(
                      accountName: const Text('Akuntansi UMKM Pro', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 18)),
                      accountEmail: const Text('Pencatatan Otomatis & Laporan'),
                      decoration: BoxDecoration(color: Colors.green.shade700),
                    ),
                    ListTile(
                      leading: const Icon(Icons.list_alt, color: Colors.green),
                      title: const Text('Jurnal Umum'),
                      onTap: () { setState(() => _activeView = 'Jurnal Umum'); Navigator.pop(context); },
                    ),
                    ListTile(
                      leading: const Icon(Icons.menu_book, color: Colors.green),
                      title: const Text('Buku Besar (1111 - KAS)'),
                      onTap: () { setState(() => _activeView = 'Buku Besar'); Navigator.pop(context); },
                    ),
                    ListTile(
                      leading: const Icon(Icons.bar_chart, color: Colors.green),
                      title: const Text('Rugi Laba'),
                      onTap: () { setState(() => _activeView = 'Rugi Laba'); Navigator.pop(context); },
                    ),
                    ListTile(
                      leading: const Icon(Icons.account_balance_wallet, color: Colors.green),
                      title: const Text('Neraca'),
                      onTap: () { setState(() => _activeView = 'Neraca'); Navigator.pop(context); },
                    ),
                  ],
                ),
              ),
              body: _buildBodyView(),
              floatingActionButton: _activeView == 'Jurnal Umum'
                  ? Row(
                      mainAxisAlignment: MainAxisAlignment.end,
                      children: [
                        FloatingActionButton.extended(
                          heroTag: 'in',
                          onPressed: () => _showForm('IN'),
                          label: const Text('Uang Masuk'),
                          icon: const Icon(Icons.add),
                          backgroundColor: Colors.green,
                        ),
                        const SizedBox(width: 10),
                        FloatingActionButton.extended(
                          heroTag: 'out',
                          onPressed: () => _showForm('OUT'),
                          label: const Text('Uang Keluar'),
                          icon: const Icon(Icons.remove),
                          backgroundColor: Colors.red,
                        ),
                      ],
                    )
                  : null,
            );
          }

          Widget _buildBodyView() {
            if (_activeView == 'Buku Besar') return _buildBukuBesar();
            if (_activeView == 'Rugi Laba') return _buildRugiLaba();
            if (_activeView == 'Neraca') return _buildNeraca();
            return _buildJurnalUmum();
          }

          // VIEW JURNAL UMUM
          Widget _buildJurnalUmum() {
            return ListView.builder(
              itemCount: _journals.length,
              itemBuilder: (ctx, i) {
                final item = _journals[i];
                return Card(
                  margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 5),
                  child: ListTile(
                    title: Text(item['description'], style: const TextStyle(fontWeight: FontWeight.bold)),
                    subtitle: Text('${item['date']}\nDb: ${item['account_debit']} | Kr: ${item['account_credit']}'),
                    trailing: Text('Rp ${item['amount'].toStringAsFixed(0)}', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                  ),
                );
              },
            );
          }

          // VIEW BUKU BESAR (SEPERTI BKPER/AKUNTANSI PRO)
          Widget _buildBukuBesar() {
            double runningBalance = 0;
            return Column(
              children: [
                Container(
                  color: Colors.green.shade800,
                  padding: const EdgeInsets.all(12),
                  child: const Row(
                    children: [
                      Expanded(child: Text('TANGGAL / KET', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold))),
                      Text('DEBIT / KREDIT', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                    ],
                  ),
                ),
                Expanded(
                  child: ListView.builder(
                    itemCount: _journals.length,
                    itemBuilder: (ctx, i) {
                      final item = _journals[i];
                      bool isKasDebit = item['account_debit'].contains('1111');
                      double debit = isKasDebit ? (item['amount'] as num).toDouble() : 0;
                      double kredit = !isKasDebit ? (item['amount'] as num).toDouble() : 0;
                      runningBalance += (debit - kredit);

                      return Container(
                        decoration: BoxDecoration(border: Border(bottom: BorderSide(color: Colors.grey.shade300))),
                        padding: const EdgeInsets.all(10),
                        child: Row(
                          children: [
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text(item['date'], style: TextStyle(color: Colors.grey.shade600, fontSize: 12)),
                                  Text(item['description'], style: const TextStyle(fontWeight: FontWeight.bold)),
                                ],
                              ),
                            ),
                            Column(
                              crossAxisAlignment: CrossAxisAlignment.end,
                              children: [
                                if (debit > 0) Text('+ Rp ${debit.toStringAsFixed(0)}', style: const TextStyle(color: Colors.green, fontWeight: FontWeight.bold)),
                                if (kredit > 0) Text('- Rp ${kredit.toStringAsFixed(0)}', style: const TextStyle(color: Colors.red, fontWeight: FontWeight.bold)),
                                Text('Saldo: Rp ${runningBalance.toStringAsFixed(0)}', style: const TextStyle(fontSize: 11, color: Colors.blueGrey)),
                              ],
                            )
                          ],
                        ),
                      );
                    },
                  ),
                ),
              ],
            );
          }

          // VIEW RUGI LABA
          Widget _buildRugiLaba() {
            double totalPendapatan = 0;
            double totalBeban = 0;
            for (var item in _journals) {
              if (item['account_credit'].contains('4111')) totalPendapatan += item['amount'];
              if (item['account_debit'].contains('511')) totalBeban += item['amount'];
            }
            double labaRugi = totalPendapatan - totalBeban;

            return Padding(
              padding: const EdgeInsets.all(16),
              child: Column(
                children: [
                  Card(
                    child: ListTile(
                      title: const Text('TOTAL PEMASUKAN / PENDAPATAN'),
                      trailing: Text('Rp ${totalPendapatan.toStringAsFixed(0)}', style: const TextStyle(color: Colors.green, fontWeight: FontWeight.bold)),
                    ),
                  ),
                  Card(
                    child: ListTile(
                      title: const Text('TOTAL PENGELUARAN / BEBAN'),
                      trailing: Text('Rp ${totalBeban.toStringAsFixed(0)}', style: const TextStyle(color: Colors.red, fontWeight: FontWeight.bold)),
                    ),
                  ),
                  const Divider(thickness: 2),
                  Card(
                    color: labaRugi >= 0 ? Colors.green.shade50 : Colors.red.shade50,
                    child: ListTile(
                      title: Text(labaRugi >= 0 ? 'LABA BERSIH' : 'RUGI BERSIH', style: const TextStyle(fontWeight: FontWeight.bold)),
                      trailing: Text('Rp ${labaRugi.toStringAsFixed(0)}', style: TextStyle(color: labaRugi >= 0 ? Colors.green : Colors.red, fontWeight: FontWeight.bold, fontSize: 18)),
                    ),
                  )
                ],
              ),
            );
          }

          // VIEW NERACA
          Widget _buildNeraca() {
            double kas = 0;
            double modal = 0;
            for (var item in _journals) {
              if (item['account_debit'].contains('1111')) kas += item['amount'];
              if (item['account_credit'].contains('1111')) kas -= item['amount'];
              if (item['account_credit'].contains('3111')) modal += item['amount'];
            }

            return Padding(
              padding: const EdgeInsets.all(16),
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  const Text('AKTIVA (Aset)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.green)),
                  Card(
                    child: ListTile(
                      title: const Text('1111 - KAS'),
                      trailing: Text('Rp ${kas.toStringAsFixed(0)}', style: const TextStyle(fontWeight: FontWeight.bold)),
                    ),
                  ),
                  const SizedBox(height: 20),
                  const Text('PASIVA (Kewajiban & Modal)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.green)),
                  Card(
                    child: ListTile(
                      title: const Text('3111 - MODAL USAHA'),
                      trailing: Text('Rp ${modal.toStringAsFixed(0)}', style: const TextStyle(fontWeight: FontWeight.bold)),
                    ),
                  ),
                ],
              ),
            );
          }
        }
        EOF

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pembukuan-umkm-apk
        path: build/app/outputs/flutter-apk/app-release.apk
