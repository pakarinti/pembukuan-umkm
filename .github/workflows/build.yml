name: Build Android APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Create Flutter Project Structure & Upgrade Android Specs
      run: |
        flutter create --org com.kasimpel.app --project-name pembukuan .
        
        # Upgrade spesifikasi Android
        sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle
        sed -i 's/flutter.compileSdkVersion/34/g' android/app/build.gradle
        sed -i 's/flutter.targetSdkVersion/34/g' android/app/build.gradle
        if [ -f "android/settings.gradle" ]; then
          sed -i 's/version "1.7.10"/version "1.9.22"/g' android/settings.gradle
        fi
        
        cat << 'EOF' > pubspec.yaml
        name: pembukuan
        description: Kasimpel Pembukuan UMKM Gratis
        publish_to: 'none'
        version: 1.0.0+1

        environment:
          sdk: '>=3.0.0 <4.0.0'

        dependencies:
          flutter:
            sdk: flutter
          cupertino_icons: ^1.0.6
          sqflite: ^2.3.0
          path: ^1.8.3
          intl: ^0.19.0
          csv: ^6.0.0
          file_picker: ^8.0.3
          share_plus: ^9.0.0
          cross_file: ^0.3.4
          path_provider: ^2.1.3
          google_mobile_ads: ^5.1.0

        dev_dependencies:
          flutter_test:
            sdk: flutter
          flutter_lints: ^3.0.0

        flutter:
          uses-material-design: true
        EOF

        # SUNTIKAN KODE: Ganti Icon Logo Aplikasi Kasimpel Otomatis
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/res/mipmap-hdpi
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi

        python3 -c "
        import base64, urllib.request
        url = 'https://raw.githubusercontent.com/pakarinti/pembukuan/main/app_logo.png'
        " || true

        # Download langsung dari URL gambar publik yang valid
        curl -s -L "https://i.ibb.co.co/68Xb3Qz/kasimpel-icon.png" -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

        # Duplikasi logo ke seluruh folder resolusi Android
        cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
        cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
        cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
        cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true

        # Inject AdMob App ID & Nama Aplikasi ke AndroidManifest.xml
        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
                android:label="Kasimpel: Pembukuan UMKM Gratis"
                android:icon="@mipmap/ic_launcher"
                android:name="${applicationName}">
                <meta-data
                    android:name="com.google.android.gms.ads.APPLICATION_ID"
                    android:value="ca-app-pub-1566356165337565~9309046165"/>
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:launchMode="singleTop"
                    android:theme="@style/LaunchTheme"
                    android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                    android:hardwareAccelerated="true"
                    android:windowSoftInputMode="adjustResize">
                    <meta-data
                      android:name="io.flutter.embedding.android.NormalTheme"
                      android:resource="@style/NormalTheme"
                      />
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
                <meta-data
                    android:name="flutterEmbedding"
                    android:value="2" />
            </application>
        </manifest>
        EOF

        cat << 'EOF' > lib/main.dart
        import 'dart:io';
        import 'package:flutter/material.dart';
        import 'package:flutter/services.dart';
        import 'package:sqflite/sqflite.dart';
        import 'package:path/path.dart' as p;
        import 'package:intl/intl.dart';
        import 'package:csv/csv.dart';
        import 'package:file_picker/file_picker.dart';
        import 'package:share_plus/share_plus.dart';
        import 'package:cross_file/cross_file.dart';
        import 'package:path_provider/path_provider.dart';
        import 'package:google_mobile_ads/google_mobile_ads.dart';

        void main() async {
          WidgetsFlutterBinding.ensureInitialized();
          MobileAds.instance.initialize();

          final dbPath = await getDatabasesPath();
          final database = await openDatabase(
            p.join(dbPath, 'kasimpel_umkm_v1.db'),
            onCreate: (db, version) async {
              await db.execute('''
                CREATE TABLE books(
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  name TEXT UNIQUE
                )
              ''');
              await db.execute('''
                CREATE TABLE accounts(
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  book_id INTEGER,
                  name TEXT,
                  type TEXT
                )
              ''');
              await db.execute('''
                CREATE TABLE transactions(
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  book_id INTEGER,
                  date TEXT,
                  from_account TEXT,
                  to_account TEXT,
                  description TEXT,
                  amount REAL
                )
              ''');

              await db.insert('books', {'name': 'Bisnis Anda'});
            },
            version: 1,
          );
          runApp(BkperApp(database: database));
        }

        class BkperApp extends StatelessWidget {
          final Database database;
          const BkperApp({super.key, required this.database});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              debugShowCheckedModeBanner: false,
              title: 'Kasimpel: Pembukuan UMKM Gratis',
              theme: ThemeData.dark().copyWith(
                scaffoldBackgroundColor: const Color(0xFF121318),
                primaryColor: const Color(0xFF1C1D24),
                colorScheme: const ColorScheme.dark(primary: Colors.blueAccent),
              ),
              home: HomeScreen(database: database),
            );
          }
        }

        class HomeScreen extends StatefulWidget {
          final Database database;
          const HomeScreen({super.key, required this.database});

          @override
          State<HomeScreen> createState() => _HomeScreenState();
        }

        class _HomeScreenState extends State<HomeScreen> {
          List<Map<String, dynamic>> _books = [];
          int? _currentBookId;
          String _currentBookName = '';

          List<Map<String, dynamic>> _allTransactions = [];
          List<Map<String, dynamic>> _allAccounts = [];
          String? _selectedAccountFilter;
          String _searchQuery = '';
          DateTime _selectedMonthPeriod = DateTime.now();

          final NumberFormat _currencyFormat = NumberFormat('#,##0.00', 'en_US');

          // IKLAN ADMOB INTERSTITIAL
          InterstitialAd? _interstitialAd;
          bool _isAdLoaded = false;
          final String _adUnitId = 'ca-app-pub-1566356165337565/4466204019';

          @override
          void initState() {
            super.initState();
            _loadBooks();
            _loadInterstitialAd();
          }

          void _loadInterstitialAd() {
            InterstitialAd.load(
              adUnitId: _adUnitId,
              request: const AdRequest(),
              adLoadCallback: InterstitialAdLoadCallback(
                onAdLoaded: (ad) {
                  _interstitialAd = ad;
                  _isAdLoaded = true;
                },
                onAdFailedToLoad: (error) {
                  _isAdLoaded = false;
                  _interstitialAd = null;
                },
              ),
            );
          }

          void _showInterstitialAd({VoidCallback? onAdClosed}) {
            if (_isAdLoaded && _interstitialAd != null) {
              _interstitialAd!.fullScreenContentCallback = FullScreenContentCallback(
                onAdDismissedFullScreenContent: (ad) {
                  ad.dispose();
                  _loadInterstitialAd();
                  if (onAdClosed != null) onAdClosed();
                },
                onAdFailedToShowFullScreenContent: (ad, error) {
                  ad.dispose();
                  _loadInterstitialAd();
                  if (onAdClosed != null) onAdClosed();
                },
              );
              _interstitialAd!.show();
            } else {
              if (onAdClosed != null) onAdClosed();
            }
          }

          Future<void> _loadBooks() async {
            final bData = await widget.database.query('books', orderBy: 'id ASC');
            if (bData.isNotEmpty) {
              setState(() {
                _books = bData;
                _currentBookId = bData.first['id'] as int;
                _currentBookName = bData.first['name'] as String;
              });
              _loadDataForCurrentBook();
            }
          }

          Future<void> _loadDataForCurrentBook() async {
            if (_currentBookId == null) return;
            final txData = await widget.database.query(
              'transactions',
              where: 'book_id = ?',
              whereArgs: [_currentBookId],
              orderBy: 'date DESC, id DESC',
            );
            final accData = await widget.database.query(
              'accounts',
              where: 'book_id = ?',
              whereArgs: [_currentBookId],
              orderBy: 'id ASC',
            );
            setState(() {
              _allTransactions = txData;
              _allAccounts = accData;
              _selectedAccountFilter = null;
            });
          }

          Future<void> _createBook(String name) async {
            try {
              final id = await widget.database.insert('books', {'name': name});
              final bData = await widget.database.query('books');
              setState(() {
                _books = bData;
                _currentBookId = id;
                _currentBookName = name;
              });
              _loadDataForCurrentBook();
            } catch (e) {}
          }

          Future<void> _updateBook(int id, String name) async {
            await widget.database.update('books', {'name': name}, where: 'id = ?', whereArgs: [id]);
            _loadBooks();
          }

          Future<void> _deleteBook(int id) async {
            if (_books.length <= 1) return;
            await widget.database.delete('books', where: 'id = ?', whereArgs: [id]);
            await widget.database.delete('accounts', where: 'book_id = ?', whereArgs: [id]);
            await widget.database.delete('transactions', where: 'book_id = ?', whereArgs: [id]);
            _loadBooks();
          }

          double _getAccountTotalMonthly(Map<String, dynamic> acc) {
            String accName = acc['name'];
            String accType = acc['type'];
            double total = 0;
            String monthYearTarget = DateFormat('MM/yyyy').format(_selectedMonthPeriod);

            for (var tx in _allTransactions) {
              String txDateStr = tx['date'];
              if (txDateStr.length >= 10) {
                String txMonthYear = txDateStr.substring(3);
                if (txMonthYear == monthYearTarget) {
                  if (tx['to_account'] == accName) {
                    total += (tx['amount'] as num).toDouble();
                  } else if (tx['from_account'] == accName) {
                    total += (accType == 'Incoming') ? (tx['amount'] as num).toDouble() : -(tx['amount'] as num).toDouble();
                  }
                }
              }
            }
            return total;
          }

          Future<void> _addAccount(String name, String type) async {
            if (_currentBookId == null) return;
            await widget.database.insert('accounts', {
              'book_id': _currentBookId,
              'name': name,
              'type': type,
            });
            await _loadDataForCurrentBook();
          }

          Future<void> _updateAccount(int id, String name, String type) async {
            await widget.database.update(
              'accounts',
              {'name': name, 'type': type},
              where: 'id = ?',
              whereArgs: [id],
            );
            await _loadDataForCurrentBook();
          }

          Future<void> _deleteAccount(int id, String name) async {
            await widget.database.delete('accounts', where: 'id = ?', whereArgs: [id]);
            await widget.database.delete('transactions', where: 'book_id = ? AND (from_account = ? OR to_account = ?)', whereArgs: [_currentBookId, name, name]);
            await _loadDataForCurrentBook();
          }

          Future<void> _addTransaction(String fromAcc, String toAcc, String desc, double amount, DateTime date) async {
            await widget.database.insert('transactions', {
              'book_id': _currentBookId,
              'date': DateFormat('dd/MM/yyyy').format(date),
              'from_account': fromAcc,
              'to_account': toAcc,
              'description': desc,
              'amount': amount,
            });
            await _loadDataForCurrentBook();
          }

          Future<void> _updateTransaction(int id, String fromAcc, String toAcc, String desc, double amount, DateTime date) async {
            await widget.database.update(
              'transactions',
              {
                'date': DateFormat('dd/MM/yyyy').format(date),
                'from_account': fromAcc,
                'to_account': toAcc,
                'description': desc,
                'amount': amount,
              },
              where: 'id = ?',
              whereArgs: [id],
            );
            await _loadDataForCurrentBook();
          }

          Future<void> _deleteTransaction(int id) async {
            await widget.database.delete('transactions', where: 'id = ?', whereArgs: [id]);
            await _loadDataForCurrentBook();
          }

          // FITUR SIMPAN PROJECT (SHARE CSV) + IKLAN
          Future<void> _saveProjectCSV() async {
            try {
              List<List<dynamic>> rows = [];
              rows.add(["Date", "From Account", "To Account", "Description", "Amount"]);

              for (var tx in _allTransactions) {
                rows.add([
                  tx['date'],
                  tx['from_account'],
                  tx['to_account'],
                  tx['description'],
                  tx['amount']
                ]);
              }

              String csvData = const ListToCsvConverter().convert(rows);
              final tempDir = await getTemporaryDirectory();
              final filePath = '${tempDir.path}/${_currentBookName.replaceAll(' ', '_')}_Backup.csv';
              final file = File(filePath);
              await file.writeAsString(csvData);

              await Share.shareXFiles([XFile(filePath)], text: 'Backup Project CSV: $_currentBookName');
              _showInterstitialAd();
            } catch (e) {
              debugPrint('Error saving project: $e');
            }
          }

          // FITUR EXPORT EXCEL (CSV JURNAL UMUM) + IKLAN
          Future<void> _exportExcel() async {
            try {
              List<List<dynamic>> rows = [];
              rows.add(["JURNAL UMUM - $_currentBookName"]);
              rows.add(["Tanggal", "Keterangan", "Akun Asal (From)", "Akun Tujuan (To)", "Jumlah (Rp)"]);

              for (var tx in _allTransactions) {
                rows.add([
                  tx['date'],
                  tx['description'].toString().isEmpty ? '-' : tx['description'],
                  tx['from_account'],
                  tx['to_account'],
                  tx['amount']
                ]);
              }

              String csvData = const ListToCsvConverter().convert(rows);
              final tempDir = await getTemporaryDirectory();
              final filePath = '${tempDir.path}/Jurnal_${_currentBookName.replaceAll(' ', '_')}.csv';
              final file = File(filePath);
              await file.writeAsString(csvData);

              await Share.shareXFiles([XFile(filePath)], text: 'Export Jurnal Excel: $_currentBookName');
              _showInterstitialAd();
            } catch (e) {
              debugPrint('Error exporting excel: $e');
            }
          }

          // FITUR IMPORT PROJECT (AUTO CREATE NEW BOOK)
          Future<void> _importProjectCSV() async {
            try {
              FilePickerResult? result = await FilePicker.platform.pickFiles(
                type: FileType.custom,
                allowedExtensions: ['csv'],
              );

              if (result != null && result.files.single.path != null) {
                final file = File(result.files.single.path!);
                final input = await file.readAsString();
                List<List<dynamic>> fields = const CsvToListConverter().convert(input);

                if (fields.length <= 1) return;

                String newBookName = "Imported_${DateFormat('ddMM_HHmm').format(DateTime.now())}";
                int newBookId = await widget.database.insert('books', {'name': newBookName});

                Set<String> createdAccs = {};

                for (int i = 1; i < fields.length; i++) {
                  var row = fields[i];
                  if (row.length >= 5) {
                    String date = row[0].toString();
                    String fromAcc = row[1].toString();
                    String toAcc = row[2].toString();
                    String desc = row[3].toString();
                    double amount = double.tryParse(row[4].toString()) ?? 0.0;

                    if (!createdAccs.contains(fromAcc)) {
                      await widget.database.insert('accounts', {'book_id': newBookId, 'name': fromAcc, 'type': 'Outgoing'});
                      createdAccs.add(fromAcc);
                    }
                    if (!createdAccs.contains(toAcc)) {
                      await widget.database.insert('accounts', {'book_id': newBookId, 'name': toAcc, 'type': 'Asset'});
                      createdAccs.add(toAcc);
                    }

                    await widget.database.insert('transactions', {
                      'book_id': newBookId,
                      'date': date,
                      'from_account': fromAcc,
                      'to_account': toAcc,
                      'description': desc,
                      'amount': amount
                    });
                  }
                }

                final bData = await widget.database.query('books');
                setState(() {
                  _books = bData;
                  _currentBookId = newBookId;
                  _currentBookName = newBookName;
                });
                await _loadDataForCurrentBook();

                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text('Buku baru "$newBookName" berhasil ditarik dari CSV!')),
                  );
                }
              }
            } catch (e) {
              debugPrint('Error importing project: $e');
            }
          }

          // TRIGGER IKLAN SAAT PRESS BACK / EXIT APLIKASI
          Future<bool> _onWillPop() async {
            final shouldExit = await showDialog<bool>(
              context: context,
              builder: (ctx) => AlertDialog(
                backgroundColor: const Color(0xFF1E1E26),
                title: const Text('Keluar Aplikasi', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                content: const Text('Apakah Anda yakin ingin keluar dari Kasimpel?', style: TextStyle(color: Colors.white70)),
                actions: [
                  TextButton(
                    onPressed: () => Navigator.of(ctx).pop(false),
                    child: const Text('NO', style: TextStyle(color: Colors.grey, fontWeight: FontWeight.bold)),
                  ),
                  ElevatedButton(
                    style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent, foregroundColor: Colors.white),
                    onPressed: () => Navigator.of(ctx).pop(true),
                    child: const Text('YES'),
                  ),
                ],
              ),
            );

            if (shouldExit == true) {
              _showInterstitialAd(onAdClosed: () {
                SystemNavigator.pop();
              });
              return false;
            }
            return false;
          }

          Color _getAccountColor(String type) {
            switch (type) {
              case 'Asset': return const Color(0xFF2196F3);
              case 'Liability': return const Color(0xFFFFC107);
              case 'Incoming': return const Color(0xFF4CAF50);
              case 'Outgoing': return const Color(0xFFF44336);
              default: return Colors.grey;
            }
          }

          void _showBookDialog({Map<String, dynamic>? bookEdit}) {
            final bookCtrl = TextEditingController(text: bookEdit != null ? bookEdit['name'] : '');
            showDialog(
              context: context,
              builder: (ctx) => AlertDialog(
                backgroundColor: const Color(0xFF1E1E26),
                title: Text(bookEdit == null ? 'Create New Book' : 'Edit Book Name'),
                content: TextField(controller: bookCtrl, decoration: const InputDecoration(labelText: 'Book / Business Name')),
                actions: [
                  TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                  ElevatedButton(
                    style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent, foregroundColor: Colors.white),
                    onPressed: () async {
                      if (bookCtrl.text.isNotEmpty) {
                        if (bookEdit == null) {
                          await _createBook(bookCtrl.text);
                        } else {
                          await _updateBook(bookEdit['id'], bookCtrl.text);
                        }
                        if (mounted) Navigator.pop(ctx);
                      }
                    },
                    child: Text(bookEdit == null ? 'Create' : 'Save'),
                  )
                ],
              ),
            );
          }

          void _showNewAccountDialog({Map<String, dynamic>? editAcc}) {
            final nameCtrl = TextEditingController(text: editAcc != null ? editAcc['name'] : '');
            String selectedType = editAcc != null ? editAcc['type'] : 'Outgoing';

            showDialog(
              context: context,
              builder: (ctx) => StatefulBuilder(
                builder: (context, setDlgState) => AlertDialog(
                  backgroundColor: const Color(0xFF1E1E26),
                  title: Text(editAcc == null ? 'New Account' : 'Edit Account'),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      TextField(controller: nameCtrl, decoration: const InputDecoration(labelText: 'Name')),
                      const SizedBox(height: 10),
                      DropdownButtonFormField<String>(
                        value: selectedType,
                        dropdownColor: const Color(0xFF2C2D38),
                        items: ['Asset', 'Liability', 'Incoming', 'Outgoing']
                            .map((t) => DropdownMenuItem(value: t, child: Text(t))).toList(),
                        onChanged: (v) => setDlgState(() => selectedType = v!),
                        decoration: const InputDecoration(labelText: 'Type'),
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: Colors.blueAccent, foregroundColor: Colors.white),
                      onPressed: () async {
                        if (nameCtrl.text.isNotEmpty) {
                          if (editAcc == null) {
                            await _addAccount(nameCtrl.text, selectedType);
                          } else {
                            await _updateAccount(editAcc['id'], nameCtrl.text, selectedType);
                          }
                          if (mounted) Navigator.pop(ctx);
                        }
                      },
                      child: Text(editAcc == null ? 'Create' : 'Save'),
                    ),
                  ],
                ),
              ),
            );
          }

          void _showFormDialog({Map<String, dynamic>? txEdit}) {
            final descCtrl = TextEditingController(text: txEdit != null ? txEdit['description'] : '');
            final amountCtrl = TextEditingController(text: txEdit != null ? txEdit['amount'].toString() : '');
            DateTime pickerDate = txEdit != null ? DateFormat('dd/MM/yyyy').parse(txEdit['date']) : DateTime.now();

            List<String> accNames = _allAccounts.map((a) => a['name'] as String).toList();
            String? fromAcc = txEdit != null ? txEdit['from_account'] : (accNames.isNotEmpty ? accNames.first : null);
            String? toAcc = txEdit != null ? txEdit['to_account'] : (accNames.length > 1 ? accNames[1] : (accNames.isNotEmpty ? accNames.first : null));

            showModalBottomSheet(
              context: context,
              isScrollControlled: true,
              backgroundColor: const Color(0xFF14151B),
              builder: (ctx) => StatefulBuilder(
                builder: (context, setModalState) {
                  return Padding(
                    padding: EdgeInsets.only(top: 16, left: 16, right: 16, bottom: MediaQuery.of(ctx).viewInsets.bottom + 16),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(txEdit == null ? 'New transaction' : 'Transaction', style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold, color: Colors.white)),
                        const SizedBox(height: 15),
                        Row(
                          children: [
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  const Text('Date:', style: TextStyle(color: Colors.grey, fontSize: 12)),
                                  const SizedBox(height: 4),
                                  InkWell(
                                    onTap: () async {
                                      final picked = await showDatePicker(
                                        context: context,
                                        initialDate: pickerDate,
                                        firstDate: DateTime(2020),
                                        lastDate: DateTime(2030),
                                      );
                                      if (picked != null) setModalState(() => pickerDate = picked);
                                    },
                                    child: Container(
                                      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 12),
                                      decoration: BoxDecoration(border: Border.all(color: Colors.white24), borderRadius: BorderRadius.circular(6)),
                                      child: Row(
                                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                        children: [
                                          Text(DateFormat('dd/MM/yyyy').format(pickerDate), style: const TextStyle(fontSize: 13)),
                                          const Icon(Icons.calendar_today, size: 16, color: Colors.grey),
                                        ],
                                      ),
                                    ),
                                  ),
                                ],
                              ),
                            ),
                            const SizedBox(width: 10),
