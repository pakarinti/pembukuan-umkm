          Widget _buildTransactionDrawerItem(Map<String, dynamic> acc) {
            double total = _getAccountTotalMonthly(acc);
            Color accColor = _getAccountColor(acc['type']);
            final formattedTotal = _currencyFormat.format(total);

            return Container(
              margin: const EdgeInsets.symmetric(vertical: 2),
              decoration: BoxDecoration(
                border: Border(left: BorderSide(color: accColor, width: 4)),
              ),
              child: ListTile(
                dense: true,
                contentPadding: const EdgeInsets.only(left: 8),
                title: Text(acc['name'], style: const TextStyle(color: Colors.white, fontSize: 13)),
                trailing: Text(
                  formattedTotal,
                  style: TextStyle(color: accColor, fontWeight: FontWeight.bold, fontSize: 13),
                ),
                onTap: () {
                  setState(() => _selectedAccountFilter = acc['name']);
                  Navigator.pop(context);
                },
              ),
            );
          }
        }
