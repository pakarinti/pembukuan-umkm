          @override
          Widget build(BuildContext context) {
            List<Map<String, dynamic>> filteredList = _allTransactions.where((tx) {
              bool matchFilter = _selectedAccountFilter == null || tx['from_account'] == _selectedAccountFilter || tx['to_account'] == _selectedAccountFilter;
              bool matchSearch = _searchQuery.isEmpty ||
                  tx['description'].toString().toLowerCase().contains(_searchQuery.toLowerCase()) ||
                  tx['from_account'].toString().toLowerCase().contains(_searchQuery.toLowerCase()) ||
                  tx['to_account'].toString().toLowerCase().contains(_searchQuery.toLowerCase()) ||
                  tx['amount'].toString().contains(_searchQuery);
              return matchFilter && matchSearch;
            }).toList();

            final assetAccs = _allAccounts.where((a) => a['type'] == 'Asset').toList();
            final liabilityAccs = _allAccounts.where((a) => a['type'] == 'Liability').toList();
            final balanceSheetAccs = [...assetAccs, ...liabilityAccs];

            final incomingAccs = _allAccounts.where((a) => a['type'] == 'Incoming').toList();
            final outgoingAccs = _allAccounts.where((a) => a['type'] == 'Outgoing').toList();
            final incomingOutgoingAccs = [...incomingAccs, ...outgoingAccs];

            final sortedAllAccountsTab = [
              ...assetAccs,
              ...liabilityAccs,
              ...incomingAccs,
              ...outgoingAccs,
